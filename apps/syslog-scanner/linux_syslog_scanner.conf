#DSN=sqlite.db
DSN=maria-firewall
input = journalctl -f
# nft: own table with timed sets, works on Arch or next to ufw on Ubuntu (run nft-setup.sh once per boot)
# ufw: plain ufw deny rules; no timeouts, so bans stay until unbanned
firewall = nft
# explicit commands override the ones 'firewall' picks
#command = echo-list.bat # windows test command
#unban command=unban.sh
# how long a ban lasts (nft timeout)
ban seconds=86400
# bans cover the whole network around an address: /24 for IPv4, /64 for IPv6
v4 prefix=24
v6 prefix=64
